<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Solicitud de Materiales</title>
  <style>
    :root {
      /* Paleta futurista */
      --bg-gradient: linear-gradient(135deg, #0a1428 0%, #1a2a40 100%);
      --glass-bg: rgba(20, 35, 60, 0.6);
      --glass-border: rgba(0, 230, 118, 0.2);
      --accent-color: #00e676;
      --text-white: #f0f4f8;
      --text-gray: #a0aec0;
      --input-bg: rgba(0, 0, 0, 0.3);
    }

    body { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; background: var(--bg-gradient); background-attachment: fixed; color: var(--text-white); margin: 0; padding: 20px; min-height: 100vh; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: var(--text-white); letter-spacing: 3px; text-transform: uppercase; text-align: center; margin-bottom: 40px; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
    
    .toggle-section-btn { width: 100%; padding: 18px; margin-bottom: 15px; background: var(--glass-bg); color: var(--text-white); border: 1px solid var(--glass-border); border-radius: 12px; cursor: pointer; font-size: 1.1rem; font-weight: 600; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; }
    .toggle-section-btn:hover { background: rgba(0, 230, 118, 0.1); border-color: var(--accent-color); }
    .toggle-section-btn.active { background: var(--accent-color); color: #000; box-shadow: 0 0 15px var(--accent-color); }

    .section-content { display: none; }
    .section-content.show { display: block; animation: fadeIn 0.5s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    .card { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 15px; padding: 25px; margin-bottom: 25px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.5); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full-width { grid-column: 1 / -1; }
    
    label { font-size: 0.8rem; margin-bottom: 8px; color: var(--text-gray); text-transform: uppercase; }
    input, select, textarea { background: var(--input-bg); border: 1px solid #334e68; color: #fff; padding: 12px; border-radius: 8px; transition: border 0.3s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-color); }
    
    .btn-camera { background: #2d3748; border: 1px solid #4a5568; color: white; padding: 10px; cursor: pointer; border-radius: 6px; }
    .btn-camera:hover { background: #4a5568; }
    .btn-submit { grid-column: 1 / -1; background: transparent; color: var(--accent-color); border: 2px solid var(--accent-color); padding: 15px; cursor: pointer; font-weight: bold; text-transform: uppercase; border-radius: 8px; transition: 0.3s; }
    .btn-submit:hover { background: var(--accent-color); color: #000; box-shadow: 0 0 20px var(--accent-color); }

    table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 20px; }
    th { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); padding: 15px; text-transform: uppercase; font-size: 0.8rem; }
    td { border-bottom: 1px solid #2d3748; padding: 15px; }
    .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; border: 1px solid #4a5568; }
    .ensamble-tag { display: inline-block; background: rgba(0,230,118,0.1); color: var(--accent-color); padding: 4px 8px; font-size: 0.75rem; margin: 2px; border-radius: 4px; border: 1px solid var(--accent-color); }
  </style>
</head>
<body>

<div class="container">
  <h1>Portal de Materiales</h1>

  <button class="toggle-section-btn" onclick="toggleSection('formSection', this)">1. Ingresar Nuevo Registro</button>
  <div id="formSection" class="section-content">
    <div class="card">
        <form id="materialForm" class="form-grid">
        <div class="form-group"><label>N/P</label><input type="text" id="np" required></div>
        <div class="form-group">
            <label>Unidad</label>
            <select id="unidad" required>
                <option value="Pieza">Pieza</option><option value="Caja">Caja</option>
                <option value="Juego">Juego</option><option value="Kg">Kg</option>
            </select>
        </div>
        <div class="form-group"><label>Qty Unit</label><input type="number" id="qtyUnit" step="0.01" required></div>

        <div class="form-group">
            <label>Ensamble(s)</label>
            <select id="ensamble" multiple required style="height: 140px;">
                <option value="13906-001">13906-001</option>
                <option value="13906-002">13906-002</option>
                <option value="13906-071">13906-071</option>
                <option value="13906-072">13906-072</option>
                <option value="13906-074">13906-074</option>
                <option value="13936-071">13936-071</option>
                <option value="13936-72">13936-72</option>
                <option value="13908-001">13908-001</option>
                <option value="13908-002">13908-002</option>
                <option value="13908-071">13908-071</option>
                <option value="13908-072">13908-072</option>
                <option value="13908-074">13908-074</option>
            </select>
        </div>

        <div class="form-group full-width"><label>Descripción</label><textarea id="descripcion" required></textarea></div>

        <div class="form-group full-width camera-container">
            <label>Captura</label>
            <button type="button" class="btn-camera" id="startBtn">Activar Cámara</button>
            <video id="video" autoplay playsinline style="display:none; width: 100%; max-width: 300px; background: #000; border-radius: 8px;"></video>
            <button type="button" class="btn-camera" id="snapBtn" style="display:none; background: var(--accent-color); color: black;">Tomar Foto</button>
            <canvas id="canvas" style="display:none;"></canvas>
            <img id="imgResult" style="display:none; max-width: 100px; margin-top: 10px; border-radius: 4px;">
        </div>
        <button type="submit" class="btn-submit">Registrar Material</button>
        </form>
    </div>
  </div>

  <button class="toggle-section-btn" onclick="toggleSection('listSection', this)">2. Lista de Materiales</button>
  <div id="listSection" class="section-content">
    <div class="card">
        <table id="tablaMateriales">
            <thead><tr><th>Imagen</th><th>N/P</th><th>Descripción</th><th>U. Medida</th><th>Qty Unit</th><th>Ensamble</th></tr></thead>
            <tbody id="tablaCuerpo"></tbody>
        </table>
    </div>
  </div>

  <button class="toggle-section-btn" onclick="toggleSection('pickListSection', this)">3. Pick List</button>
  <div id="pickListSection" class="section-content">
    <div class="card">
        <div class="form-grid">
            <div class="form-group">
                <label>Ensamble</label>
                <select id="pickEnsambleFilter">
                    <option value="">Seleccione un Ensamble...</option>
                    <option value="13906-001">13906-001</option>
                    <option value="13906-002">13906-002</option>
                    <option value="13906-071">13906-071</option>
                    <option value="13906-072">13906-072</option>
                    <option value="13906-074">13906-074</option>
                    <option value="13936-071">13936-071</option>
                    <option value="13936-72">13936-72</option>
                    <option value="13908-001">13908-001</option>
                    <option value="13908-002">13908-002</option>
                    <option value="13908-071">13908-071</option>
                    <option value="13908-072">13908-072</option>
                    <option value="13908-074">13908-074</option>
                </select>
            </div>
            <div class="form-group">
                <label>Cantidad a Construir</label>
                <input type="number" id="cantidadConstruir" placeholder="Ej. 10">
            </div>
            <button class="btn-submit" onclick="generarPickList()">Calcular Pick List</button>
        </div>
        
        <table id="tablaPickList" style="display:none;">
            <thead><tr><th>Imagen</th><th>N/P</th><th>Descripción</th><th>Qty Requerida</th></tr></thead>
            <tbody id="tablaPickCuerpo"></tbody>
        </table>
    </div>
  </div>
</div>

<script>
  function toggleSection(id, btn) {
      const content = document.getElementById(id);
      content.classList.toggle('show');
      btn.classList.toggle('active');
  }

  // --- LÓGICA DE CÁMARA ---
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const imgResult = document.getElementById('imgResult');
  const startBtn = document.getElementById('startBtn');
  const snapBtn = document.getElementById('snapBtn');
  let capturedImageData = null;

  startBtn.addEventListener('click', async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      video.style.display = 'block';
      snapBtn.style.display = 'block';
      startBtn.textContent = 'Cámara Activa';
    } catch (err) { alert("Error al acceder a la cámara: " + err); }
  });

  snapBtn.addEventListener('click', () => {
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    capturedImageData = canvas.toDataURL('image/png');
    imgResult.src = capturedImageData; imgResult.style.display = 'block';
    video.srcObject.getTracks().forEach(track => track.stop());
    video.style.display = 'none'; snapBtn.style.display = 'none';
    startBtn.textContent = 'Capturado';
  });

  // --- LÓGICA DE REGISTRO ---
  document.getElementById('materialForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const np = document.getElementById('np').value;
    const desc = document.getElementById('descripcion').value;
    const unid = document.getElementById('unidad').value;
    const qU = parseFloat(document.getElementById('qtyUnit').value);
    const newEns = Array.from(document.getElementById('ensamble').selectedOptions).map(o => o.value);
    const tablaCuerpo = document.getElementById('tablaCuerpo');
    const filas = tablaCuerpo.getElementsByTagName('tr');
    
    let encontrado = false;
    for (let i = 0; i < filas.length; i++) {
        if (filas[i].cells[1].textContent === np && filas[i].cells[2].textContent === desc) {
            encontrado = true;
            const celdEns = filas[i].cells[5];
            const tagsExistentes = Array.from(celdEns.querySelectorAll('.ensamble-tag')).map(t => t.textContent);
            newEns.forEach(ens => { if (!tagsExistentes.includes(ens)) tagsExistentes.push(ens); });
            celdEns.innerHTML = tagsExistentes.map(e => `<span class="ensamble-tag">${e}</span>`).join(' ');
            break;
        }
    }

    if (!encontrado) {
        const row = document.createElement('tr');
        row.innerHTML = `<td><img src="${capturedImageData || 'https://via.placeholder.com/50'}" class="img-preview"></td>
          <td>${np}</td><td>${desc}</td><td>${unid}</td><td>${qU}</td>
          <td>${newEns.map(e => `<span class="ensamble-tag">${e}</span>`).join(' ')}</td>`;
        tablaCuerpo.appendChild(row);
    }
    document.getElementById('materialForm').reset();
    imgResult.style.display = 'none'; capturedImageData = null; startBtn.textContent = 'Activar Cámara';
  });

  // --- LÓGICA DE PICK LIST ---
  function generarPickList() {
    const ensambleFiltro = document.getElementById('pickEnsambleFilter').value;
    const cantidadConstruir = parseFloat(document.getElementById('cantidadConstruir').value);
    
    if(!ensambleFiltro || isNaN(cantidadConstruir)) { alert("Por favor seleccione un ensamble y la cantidad a construir."); return; }

    const tablaCuerpo = document.getElementById('tablaCuerpo');
    const filas = tablaCuerpo.getElementsByTagName('tr');
    const tablaPickCuerpo = document.getElementById('tablaPickCuerpo');
    const tablaPickList = document.getElementById('tablaPickList');
    
    tablaPickCuerpo.innerHTML = ''; 
    const resumen = {}; 

    for (let fila of filas) {
        const ensambleTags = Array.from(fila.cells[5].querySelectorAll('.ensamble-tag')).map(t => t.textContent);
        
        if (ensambleTags.includes(ensambleFiltro)) {
            const img = fila.cells[0].querySelector('img').src;
            const np = fila.cells[1].textContent;
            const desc = fila.cells[2].textContent;
            const qtyUnit = parseFloat(fila.cells[4].textContent);
            
            const key = np; 
            if (!resumen[key]) {
                resumen[key] = { img, desc, total: 0 };
            }
            resumen[key].total += (qtyUnit * cantidadConstruir);
        }
    }

    for (let key in resumen) {
        const item = resumen[key];
        const row = document.createElement('tr');
        row.innerHTML = `<td><img src="${item.img}" class="img-preview"></td><td>${key}</td><td>${item.desc}</td><td>${item.total.toFixed(2)}</td>`;
        tablaPickCuerpo.appendChild(row);
    }
    
    tablaPickList.style.display = 'table';
  }
</script>

</body>
</html>
