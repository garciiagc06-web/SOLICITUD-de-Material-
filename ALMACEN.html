<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Solicitud de Materiales</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0a1428 0%, #1a2a40 100%);
      --glass-bg: rgba(20, 35, 60, 0.6);
      --glass-border: rgba(0, 230, 118, 0.2);
      --accent-color: #00e676;
      --text-white: #f0f4f8;
      --text-gray: #a0aec0;
      --input-bg: rgba(0, 0, 0, 0.3);
    }

    body { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; background: var(--bg-gradient); background-attachment: fixed; color: var(--text-white); margin: 0; padding: 20px; min-height: 100vh; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: var(--text-white); letter-spacing: 3px; text-transform: uppercase; text-align: center; margin-bottom: 40px; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
    
    .toggle-section-btn { width: 100%; padding: 18px; margin-bottom: 15px; background: var(--glass-bg); color: var(--text-white); border: 1px solid var(--glass-border); border-radius: 12px; cursor: pointer; font-size: 1.1rem; font-weight: 600; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; }
    .toggle-section-btn:hover { background: rgba(0, 230, 118, 0.1); border-color: var(--accent-color); }
    .toggle-section-btn.active { background: var(--accent-color); color: #000; box-shadow: 0 0 15px var(--accent-color); }

    .section-content { display: none; }
    .section-content.show { display: block; animation: fadeIn 0.5s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    .card { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 15px; padding: 25px; margin-bottom: 25px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.5); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full-width { grid-column: 1 / -1; }
    
    label { font-size: 0.8rem; margin-bottom: 8px; color: var(--text-gray); text-transform: uppercase; }
    input, select, textarea { background: var(--input-bg); border: 1px solid #334e68; color: #fff; padding: 12px; border-radius: 8px; transition: border 0.3s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-color); }
    
    .btn-camera { background: #2d3748; border: 1px solid #4a5568; color: white; padding: 10px; cursor: pointer; border-radius: 6px; }
    .btn-camera:hover { background: #4a5568; }
    .btn-submit { grid-column: 1 / -1; background: transparent; color: var(--accent-color); border: 2px solid var(--accent-color); padding: 15px; cursor: pointer; font-weight: bold; text-transform: uppercase; border-radius: 8px; transition: 0.3s; }
    .btn-submit:hover { background: var(--accent-color); color: #000; box-shadow: 0 0 20px var(--accent-color); }

    table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 20px; }
    th { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); padding: 15px; text-transform: uppercase; font-size: 0.8rem; }
    td { border-bottom: 1px solid #2d3748; padding: 15px; }
    tr.editable-row { cursor: pointer; user-select: none; transition: background 0.2s; }
    tr.editable-row:hover { background: rgba(0, 230, 118, 0.05); }
    .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; border: 1px solid #4a5568; }
    .ensamble-tag { display: inline-block; background: rgba(0,230,118,0.1); color: var(--accent-color); padding: 4px 8px; font-size: 0.75rem; margin: 2px; border-radius: 4px; border: 1px solid var(--accent-color); }

    /* Modal Flotante */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
    .modal-overlay.show { display: flex; }
    .modal-container { background: #0a1428; border: 1px solid var(--accent-color); border-radius: 15px; width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; padding: 25px; box-shadow: 0 0 30px rgba(0,230,118,0.2); position: relative; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }
    .modal-header h2 { margin: 0; color: var(--accent-color); font-size: 1.2rem; text-transform: uppercase; }
    .close-modal { background: transparent; border: none; color: var(--text-gray); font-size: 1.5rem; cursor: pointer; }
    .close-modal:hover { color: #ff5252; }
    .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
    .btn-delete { background: rgba(255, 82, 82, 0.2); color: #ff5252; border: 1px solid #ff5252; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; flex: 1; }
    .btn-delete:hover { background: #ff5252; color: #000; }
    .btn-save-edit { background: var(--accent-color); color: #000; border: 1px solid var(--accent-color); padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; flex: 2; }
  </style>
</head>
<body>

<div class="container">
  <h1>Portal de Materiales</h1>

  <button class="toggle-section-btn" onclick="toggleSection('formSection', this)">1. Ingresar Nuevo Registro</button>
  <div id="formSection" class="section-content">
    <div class="card">
        <form id="materialForm" class="form-grid">
        <div class="form-group"><label>N/P</label><input type="text" id="np" required></div>
        <div class="form-group">
            <label>Unidad</label>
            <select id="unidad" required>
                <option value="Pieza">Pieza</option><option value="Caja">Caja</option>
                <option value="Juego">Juego</option><option value="Kg">Kg</option>
            </select>
        </div>
        <div class="form-group"><label>Qty Unit</label><input type="number" id="qtyUnit" step="0.01" required></div>

        <div class="form-group">
            <label>Ensamble(s)</label>
            <select id="ensamble" multiple required style="height: 140px;">
                <option value="13906-001">13906-001</option>
                <option value="13906-002">13906-002</option>
                <option value="13906-071">13906-071</option>
                <option value="13906-072">13906-072</option>
                <option value="13906-074">13906-074</option>
                <option value="13936-071">13936-071</option>
                <option value="13936-72">13936-72</option>
                <option value="13908-001">13908-001</option>
                <option value="13908-002">13908-002</option>
                <option value="13908-071">13908-071</option>
                <option value="13908-072">13908-072</option>
                <option value="13908-074">13908-074</option>
            </select>
        </div>

        <div class="form-group full-width"><label>Descripción</label><textarea id="descripcion" required></textarea></div>

        <div class="form-group full-width camera-container">
            <label>Captura</label>
            <button type="button" class="btn-camera" id="startBtn">Activar Cámara</button>
            <video id="video" autoplay playsinline style="display:none; width: 100%; max-width: 300px; background: #000; border-radius: 8px;"></video>
            <button type="button" class="btn-camera" id="snapBtn" style="display:none; background: var(--accent-color); color: black;">Tomar Foto</button>
            <canvas id="canvas" style="display:none;"></canvas>
            <img id="imgResult" style="display:none; max-width: 100px; margin-top: 10px; border-radius: 4px;">
        </div>
        <button type="submit" class="btn-submit" id="btnSubmit">Registrar Material</button>
        </form>
    </div>
  </div>

  <button class="toggle-section-btn" onclick="toggleSection('listSection', this)">2. Lista de Materiales</button>
  <div id="listSection" class="section-content">
    <div class="card">
        <table id="tablaMateriales">
            <thead><tr><th>Imagen</th><th>N/P</th><th>Descripción</th><th>U. Medida</th><th>Qty Unit</th><th>Ensamble</th></tr></thead>
            <tbody id="tablaCuerpo"></tbody>
        </table>
    </div>
  </div>

  <button class="toggle-section-btn" onclick="toggleSection('pickListSection', this)">3. Pick List</button>
  <div id="pickListSection" class="section-content">
    <div class="card">
        <div class="form-grid">
            <div class="form-group">
                <label>Ensamble</label>
                <select id="pickEnsambleFilter">
                    <option value="">Seleccione un Ensamble...</option>
                    <option value="13906-001">13906-001</option>
                    <option value="13906-002">13906-002</option>
                    <option value="13906-071">13906-071</option>
                    <option value="13906-072">13906-072</option>
                    <option value="13906-074">13906-074</option>
                    <option value="13936-071">13936-071</option>
                    <option value="13936-72">13936-72</option>
                    <option value="13908-001">13908-001</option>
                    <option value="13908-002">13908-002</option>
                    <option value="13908-071">13908-071</option>
                    <option value="13908-072">13908-072</option>
                    <option value="13908-074">13908-074</option>
                </select>
            </div>
            <div class="form-group">
                <label>Cantidad a Construir</label>
                <input type="number" id="cantidadConstruir" placeholder="Ej. 10">
            </div>
            <button class="btn-submit" onclick="generarPickList()">Calcular Pick List</button>
        </div>
        
        <table id="tablaPickList" style="display:none;">
            <thead><tr><th>Imagen</th><th>N/P</th><th>Descripción</th><th>Qty Requerida</th></tr></thead>
            <tbody id="tablaPickCuerpo"></tbody>
        </table>
    </div>
  </div>
</div>

<!-- MODAL FLOTANTE -->
<div id="editModal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h2>Modificar Registro</h2>
      <button class="close-modal" id="closeEditModal">&times;</button>
    </div>
    <form id="editMaterialForm" class="form-grid">
      <input type="hidden" id="editDocId">
      <div class="form-group"><label>N/P</label><input type="text" id="editNp" required></div>
      <div class="form-group">
          <label>Unidad</label>
          <select id="editUnidad" required>
              <option value="Pieza">Pieza</option><option value="Caja">Caja</option>
              <option value="Juego">Juego</option><option value="Kg">Kg</option>
          </select>
      </div>
      <div class="form-group"><label>Qty Unit</label><input type="number" id="editQtyUnit" step="0.01" required></div>

      <div class="form-group">
          <label>Ensamble(s)</label>
          <select id="editEnsamble" multiple required style="height: 140px;">
              <option value="13906-001">13906-001</option>
              <option value="13906-002">13906-002</option>
              <option value="13906-071">13906-071</option>
              <option value="13906-072">13906-072</option>
              <option value="13906-074">13906-074</option>
              <option value="13936-071">13936-071</option>
              <option value="13936-72">13936-72</option>
              <option value="13908-001">13908-001</option>
              <option value="13908-002">13908-002</option>
              <option value="13908-071">13908-071</option>
              <option value="13908-072">13908-072</option>
              <option value="13908-074">13908-074</option>
          </select>
      </div>

      <div class="form-group full-width"><label>Descripción</label><textarea id="editDescripcion" required></textarea></div>

      <div class="form-group full-width camera-container">
          <label>Captura de Imagen</label>
          <button type="button" class="btn-camera" id="editStartBtn">Activar Cámara</button>
          <video id="editVideo" autoplay playsinline style="display:none; width: 100%; max-width: 300px; background: #000; border-radius: 8px;"></video>
          <button type="button" class="btn-camera" id="editSnapBtn" style="display:none; background: var(--accent-color); color: black;">Tomar Foto Nueva</button>
          <canvas id="editCanvas" style="display:none;"></canvas>
          <img id="editImgResult" style="max-width: 100px; margin-top: 10px; border-radius: 4px;">
      </div>

      <div class="modal-actions full-width">
        <button type="button" class="btn-delete" id="deleteMaterialBtn">Eliminar</button>
        <button type="submit" class="btn-save-edit" id="btnSaveEdit">Guardar Cambios</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    onSnapshot, 
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDg4s6-NstK-2qAGQdhJlogBxBjxzWFF18",
    authDomain: "pick-list-e5d5e.firebaseapp.com",
    projectId: "pick-list-e5d5e",
    storageBucket: "pick-list-e5d5e.firebasestorage.app",
    messagingSenderId: "510404429895",
    appId: "1:510404429895:web:ab61807040c45db1df0962",
    measurementId: "G-8VPJFYQ0MM"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const materialesRef = collection(db, "materiales");

  let materialesCache = {};

  window.toggleSection = function(id, btn) {
      const content = document.getElementById(id);
      content.classList.toggle('show');
      btn.classList.toggle('active');
  };

  // CÁMARA REGISTRO CON COMPRESIÓN
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const imgResult = document.getElementById('imgResult');
  const startBtn = document.getElementById('startBtn');
  const snapBtn = document.getElementById('snapBtn');
  let capturedImageData = null;

  startBtn.addEventListener('click', async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      video.style.display = 'block';
      snapBtn.style.display = 'block';
      startBtn.textContent = 'Cámara Activa';
    } catch (err) { alert("Error al acceder a la cámara: " + err); }
  });

  snapBtn.addEventListener('click', () => {
    // Redimensionar imagen a máximo 400px de ancho para minimizar tamaño de guardado
    const scale = 400 / video.videoWidth;
    canvas.width = 400; 
    canvas.height = video.videoHeight * scale;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Comprimir la calidad al 60%
    capturedImageData = canvas.toDataURL('image/jpeg', 0.6);
    imgResult.src = capturedImageData; 
    imgResult.style.display = 'block';
    if(video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
    video.style.display = 'none'; 
    snapBtn.style.display = 'none';
    startBtn.textContent = 'Capturado';
  });

  // CÁMARA EDICIÓN CON COMPRESIÓN
  const editVideo = document.getElementById('editVideo');
  const editCanvas = document.getElementById('editCanvas');
  const editImgResult = document.getElementById('editImgResult');
  const editStartBtn = document.getElementById('editStartBtn');
  const editSnapBtn = document.getElementById('editSnapBtn');
  let editCapturedImageData = null;

  editStartBtn.addEventListener('click', async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      editVideo.srcObject = stream;
      editVideo.style.display = 'block';
      editSnapBtn.style.display = 'block';
      editStartBtn.textContent = 'Cámara Activa';
    } catch (err) { alert("Error al acceder a la cámara: " + err); }
  });

  editSnapBtn.addEventListener('click', () => {
    const scale = 400 / editVideo.videoWidth;
    editCanvas.width = 400; 
    editCanvas.height = editVideo.videoHeight * scale;
    const ctx = editCanvas.getContext('2d');
    ctx.drawImage(editVideo, 0, 0, editCanvas.width, editCanvas.height);
    
    editCapturedImageData = editCanvas.toDataURL('image/jpeg', 0.6);
    editImgResult.src = editCapturedImageData; 
    if(editVideo.srcObject) editVideo.srcObject.getTracks().forEach(track => track.stop());
    editVideo.style.display = 'none'; 
    editSnapBtn.style.display = 'none';
    editStartBtn.textContent = 'Foto Nueva Capturada';
  });

  // GUARDAR EN FIREBASE
  document.getElementById('materialForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btnSubmit = document.getElementById('btnSubmit');
    btnSubmit.disabled = true;
    btnSubmit.textContent = "Guardando...";

    const np = document.getElementById('np').value.trim();
    const desc = document.getElementById('descripcion').value.trim();
    const unid = document.getElementById('unidad').value;
    const qU = parseFloat(document.getElementById('qtyUnit').value);
    const ensambles = Array.from(document.getElementById('ensamble').selectedOptions).map(o => o.value);

    const nuevoRegistro = {
      np: np,
      descripcion: desc,
      unidad: unid,
      qtyUnit: qU,
      ensambles: ensambles,
      imagen: capturedImageData || 'https://via.placeholder.com/50',
      fecha: serverTimestamp()
    };

    try {
      await addDoc(materialesRef, nuevoRegistro);
      alert("¡Material registrado con éxito!");
      document.getElementById('materialForm').reset();
      imgResult.style.display = 'none'; 
      capturedImageData = null; 
      startBtn.textContent = 'Activar Cámara';
    } catch (error) {
      console.error("Error al guardar:", error);
      alert("Error en Firebase: " + error.message);
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = "Registrar Material";
    }
  });

  // LEER EN TIEMPO REAL
  onSnapshot(materialesRef, (snapshot) => {
    const tablaCuerpo = document.getElementById('tablaCuerpo');
    tablaCuerpo.innerHTML = ''; 
    materialesCache = {};

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const id = docSnap.id;
      materialesCache[id] = { id, ...data };

      const row = document.createElement('tr');
      row.className = 'editable-row';
      
      const ensambleBadges = (data.ensambles || [])
        .map(e => `<span class="ensamble-tag">${e}</span>`)
        .join(' ');

      row.innerHTML = `
        <td><img src="${data.imagen || 'https://via.placeholder.com/50'}" class="img-preview"></td>
        <td>${data.np || ''}</td>
        <td>${data.descripcion || ''}</td>
        <td>${data.unidad || ''}</td>
        <td>${data.qtyUnit || 0}</td>
        <td>${ensambleBadges}</td>
      `;

      row.addEventListener('dblclick', () => abrirModalEditar(id));
      tablaCuerpo.appendChild(row);
    });
  }, (error) => {
    console.error("Error al leer Firestore:", error);
    alert("Error de conexión a Firebase: " + error.message);
  });

  // MODAL Y EDICIÓN
  const editModal = document.getElementById('editModal');
  const closeEditModal = document.getElementById('closeEditModal');

  function abrirModalEditar(id) {
    const data = materialesCache[id];
    if (!data) return;

    document.getElementById('editDocId').value = id;
    document.getElementById('editNp').value = data.np || '';
    document.getElementById('editUnidad').value = data.unidad || 'Pieza';
    document.getElementById('editQtyUnit').value = data.qtyUnit || 0;
    document.getElementById('editDescripcion').value = data.descripcion || '';

    const selectEnsamble = document.getElementById('editEnsamble');
    Array.from(selectEnsamble.options).forEach(opt => {
      opt.selected = (data.ensambles || []).includes(opt.value);
    });

    editCapturedImageData = data.imagen || null;
    editImgResult.src = editCapturedImageData || 'https://via.placeholder.com/50';
    editImgResult.style.display = 'block';
    editStartBtn.textContent = 'Activar Cámara';

    editModal.classList.add('show');
  }

  function cerrarModal() {
    editModal.classList.remove('show');
    if (editVideo.srcObject) editVideo.srcObject.getTracks().forEach(track => track.stop());
    editVideo.style.display = 'none';
    editSnapBtn.style.display = 'none';
  }

  closeEditModal.addEventListener('click', cerrarModal);
  editModal.addEventListener('click', (e) => { if (e.target === editModal) cerrarModal(); });

  document.getElementById('editMaterialForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('editDocId').value;
    if (!id) return;

    const btnSaveEdit = document.getElementById('btnSaveEdit');
    btnSaveEdit.disabled = true;

    const np = document.getElementById('editNp').value.trim();
    const desc = document.getElementById('editDescripcion').value.trim();
    const unid = document.getElementById('editUnidad').value;
    const qU = parseFloat(document.getElementById('editQtyUnit').value);
    const ensambles = Array.from(document.getElementById('editEnsamble').selectedOptions).map(o => o.value);

    try {
      await updateDoc(doc(db, "materiales", id), {
        np, descripcion: desc, unidad: unid, qtyUnit: qU, ensambles,
        imagen: editCapturedImageData || 'https://via.placeholder.com/50'
      });
      alert("Registro actualizado.");
      cerrarModal();
    } catch (error) {
      alert("Error al actualizar: " + error.message);
    } finally {
      btnSaveEdit.disabled = false;
    }
  });

  document.getElementById('deleteMaterialBtn').addEventListener('click', async () => {
    const id = document.getElementById('editDocId').value;
    if (!id) return;
    if (confirm("¿Deseas eliminar este registro?")) {
      try {
        await deleteDoc(doc(db, "materiales", id));
        alert("Registro eliminado.");
        cerrarModal();
      } catch (error) {
        alert("Error al eliminar: " + error.message);
      }
    }
  });

  // PICK LIST
  window.generarPickList = function() {
    const ensambleFiltro = document.getElementById('pickEnsambleFilter').value;
    const cantidadConstruir = parseFloat(document.getElementById('cantidadConstruir').value);
    
    if(!ensambleFiltro || isNaN(cantidadConstruir)) { 
      alert("Seleccione un ensamble y la cantidad."); 
      return; 
    }

    const tablaCuerpo = document.getElementById('tablaCuerpo');
    const filas = tablaCuerpo.getElementsByTagName('tr');
    const tablaPickCuerpo = document.getElementById('tablaPickCuerpo');
    const tablaPickList = document.getElementById('tablaPickList');
    
    tablaPickCuerpo.innerHTML = ''; 
    const resumen = {}; 

    for (let fila of filas) {
        const ensambleTags = Array.from(fila.cells[5].querySelectorAll('.ensamble-tag')).map(t => t.textContent);
        if (ensambleTags.includes(ensambleFiltro)) {
            const img = fila.cells[0].querySelector('img').src;
            const np = fila.cells[1].textContent;
            const desc = fila.cells[2].textContent;
            const qtyUnit = parseFloat(fila.cells[4].textContent);
            
            if (!resumen[np]) resumen[np] = { img, desc, total: 0 };
            resumen[np].total += (qtyUnit * cantidadConstruir);
        }
    }

    for (let key in resumen) {
        const item = resumen[key];
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><img src="${item.img}" class="img-preview"></td>
          <td>${key}</td>
          <td>${item.desc}</td>
          <td>${item.total.toFixed(2)}</td>
        `;
        tablaPickCuerpo.appendChild(row);
    }
    tablaPickList.style.display = 'table';
  };
</script>
